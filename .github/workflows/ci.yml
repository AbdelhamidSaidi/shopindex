name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite is entirely offline: no network, and no test launches a
      # browser, so `playwright install` is deliberately not run here.
      - name: Tests
        run: pytest tests -q

      - name: Package imports cleanly
        run: python -c "import fbvendors, fbvendors.cli, fbvendors.site, fbvendors.osm"

      - name: CLI responds
        run: |
          python -m fbvendors --help > /dev/null
          python run_app.py --help > /dev/null

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install ruff

      # Errors only: undefined names, unused imports, broken f-strings.
      # Style rules are deliberately not enforced.
      - name: Ruff
        run: ruff check --select E9,F63,F7,F82,F401 fbvendors tests run_app.py

  smoke:
    name: pipeline smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # Runs the merge stage against an empty database: proves the stage wiring,
      # CSV schema and exit codes work without touching the network.
      - name: Merge stage on an empty database
        run: |
          mkdir -p data
          python run_app.py --only merge --db data/ci.sqlite3 --out data/ci.csv
          test -f data/ci.csv
          head -1 data/ci.csv
